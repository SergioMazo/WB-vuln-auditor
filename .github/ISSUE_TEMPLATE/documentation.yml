name: Documentation issue
description: Report unclear, incomplete, or inaccurate documentation.
title: "docs: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Document and section
      placeholder: README.md — Configuration
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is unclear or inconsistent with the code.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include credentials, real targets, or client data.
          required: true
